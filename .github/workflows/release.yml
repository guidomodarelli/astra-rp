name: Release
run-name: "golfo-rp release ${{ inputs.tag }} ${{ inputs.sha }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión creada desde local"
        required: true
        type: string
      tag:
        description: "Tag exacto del release"
        required: true
        type: string
      sha:
        description: "Commit exacto del tag"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: "golfo-rp-release"
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # The worker runs pnpm check itself in a few minutes; the limit stops a hung step (an install
    # or a test that never ends) instead of holding the release concurrency group for hours.
    timeout-minutes: 30
    env:
      HUSKY: '0'

    steps:
      - name: Checkout del release
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: true
      - name: Verificar identidad del release
        env:
          GOLFO_RP_RELEASE_VERSION: ${{ inputs.version }}
          GOLFO_RP_RELEASE_SHA: ${{ inputs.sha }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          fail() { echo "::error title=Release no autorizado::$1"; exit 1; }
          version_pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          sha_pattern='^[a-f0-9]{40,64}$'
          [[ "$GOLFO_RP_RELEASE_VERSION" =~ $version_pattern ]] || fail "El input version no es una versión estable X.Y.Z; no se instaló nada."
          [[ "$RELEASE_TAG" == "v$GOLFO_RP_RELEASE_VERSION" ]] || fail "El input tag no es el tag de release v$GOLFO_RP_RELEASE_VERSION; no se instaló nada."
          [[ "$GOLFO_RP_RELEASE_SHA" =~ $sha_pattern ]] || fail "El input sha no es un commit completo; no se instaló nada."
          git fetch --no-tags --quiet origin "+refs/heads/main:refs/remotes/origin/main" || fail "No se pudo traer origin/main para verificar $RELEASE_TAG."
          tag_sha="$(git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG^{commit}")" || fail "$RELEASE_TAG no existe como tag en origin."
          [[ "$tag_sha" == "$GOLFO_RP_RELEASE_SHA" ]] || fail "$RELEASE_TAG apunta a $tag_sha, no al commit $GOLFO_RP_RELEASE_SHA enviado."
          [[ "$(git rev-parse HEAD)" == "$GOLFO_RP_RELEASE_SHA" ]] || fail "El checkout no está en el commit $GOLFO_RP_RELEASE_SHA de $RELEASE_TAG."
          git merge-base --is-ancestor "$GOLFO_RP_RELEASE_SHA" "refs/remotes/origin/main" || fail "El commit $GOLFO_RP_RELEASE_SHA de $RELEASE_TAG no está en origin/main."
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Configurar npm para trusted publishing
        run: npm install --global npm@11.5.1

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '12.6.0'
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Checks y publicación del release
        env:
          GOLFO_RP_RELEASE_VERSION: ${{ inputs.version }}
          GOLFO_RP_RELEASE_SHA: ${{ inputs.sha }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: pnpm create-version --ci-release "$RELEASE_TAG"

